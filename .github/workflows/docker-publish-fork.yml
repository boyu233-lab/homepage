name: Build & Push Docker image (fork)

# fork 专用：在 GitHub 云端构建并推送 Docker Hub。
# 官方 docker-publish.yml 带 `if: github.repository == 'gethomepage/homepage'`，在 fork 中不会执行，故新建本文件。
#
# 使用步骤：
#   1) fork 仓库 Settings -> Secrets and variables -> Actions 添加
#        DOCKERHUB_USERNAME   Docker Hub 用户名
#        DOCKERHUB_TOKEN      Docker Hub Access Token（Read/Write 权限，不是登录密码）
#   2) Actions 页面选中 "Build & Push Docker image (fork)" -> Run workflow
#   3) 成功后镜像为 <用户名>/homepage-bookmark-manager:latest
#
# 机密只存在 GitHub Secrets，不写进代码、不经过本地。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "附加镜像标签（默认 latest）"
        required: false
        default: "latest"
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-22.04
    env:
      DH_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/homepage-bookmark-manager
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Docker Hub secrets
        env:
          DH_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DH_USERNAME" ] || [ -z "$DH_TOKEN" ]; then
            echo "::error::请先在 Settings -> Secrets and variables -> Actions 添加 DOCKERHUB_USERNAME 与 DOCKERHUB_TOKEN"
            exit 1
          fi
          echo "Docker Hub 凭据已配置"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 不传 CI=true：让 Dockerfile 的 builder 阶段自行 pnpm install + pnpm build，
      # 与本地 `pnpm build` 的验证路径一致，也不依赖 runner 上的 pnpm 版本。
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            BUILDTIME=${{ github.event.repository.updated_at }}
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          tags: |
            ${{ env.DH_IMAGE }}:latest
            ${{ env.DH_IMAGE }}:${{ inputs.tag || github.ref_name }}
            ${{ env.DH_IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
