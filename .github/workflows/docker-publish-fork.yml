name: Build & Push Docker image (fork)

# fork 专用：在 GitHub 云端构建并推送 Docker Hub。
# 官方 docker-publish.yml 带 `if: github.repository == 'gethomepage/homepage'`，在 fork 中不会执行，故新建本文件。
#
# 使用步骤：
#   1) fork 仓库 Settings -> Secrets and variables -> Actions 添加
#        DOCKERHUB_USERNAME   Docker Hub 用户名
#        DOCKERHUB_TOKEN      Docker Hub Access Token（Read/Write 权限，不是登录密码）
#   2) Actions 页面选中 "Build & Push Docker image (fork)" -> Run workflow
#   3) 成功后镜像为 <用户名>/homepage-bookmark-manager:latest
#
# 机密只存在 GitHub Secrets，不写进代码、不经过本地。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "附加镜像标签（默认 latest）"
        required: false
        default: "latest"
      offline_tar:
        description: "额外导出 amd64 离线 tar 并上传为 Actions artifact"
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # A5：tag / 手动发布前必须全量 ESLint + Vitest 绿灯，构建 job 依赖两者。
  # 本地日常迭代仍可只跑定向测试；这里只在发版时跑全量。
  # Vitest 分 4 片，与上游 test.yml 一致，避免单进程 fork worker 启动超时。
  lint-gate:
    name: Full ESLint gate
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint (full)
        run: pnpm run lint

  test-gate:
    name: Full Vitest gate (${{ matrix.shard }}/4)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Vitest (shard)
        run: pnpm -s exec vitest run --shard ${{ matrix.shard }}/4 --pool forks

  build-and-push:
    needs: [lint-gate, test-gate]
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      DH_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/homepage-bookmark-manager
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Docker Hub secrets
        env:
          DH_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DH_USERNAME" ] || [ -z "$DH_TOKEN" ]; then
            echo "::error::请先在 Settings -> Secrets and variables -> Actions 添加 DOCKERHUB_USERNAME 与 DOCKERHUB_TOKEN"
            exit 1
          fi
          echo "Docker Hub 凭据已配置"

      - name: Resolve short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Set up QEMU (arm64)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 不传 CI=true：让 Dockerfile 的 builder 阶段自行 pnpm install + pnpm build，
      # 与本地 `pnpm build` 的验证路径一致，也不依赖 runner 上的 pnpm 版本。
      - name: Build and push (amd64 + arm64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            BUILDTIME=${{ github.event.repository.updated_at }}
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          tags: |
            ${{ env.DH_IMAGE }}:latest
            ${{ env.DH_IMAGE }}:${{ inputs.tag || github.ref_name }}
            ${{ env.DH_IMAGE }}:sha-${{ env.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A4：Registry 侧核验多架构 manifest 与三标签 digest 一致，避免「推成功但其实只有一个架构」。
      - name: Verify multi-arch manifest and tags
        run: |
          set -euo pipefail
          IMAGE="${DH_IMAGE}:${{ inputs.tag || github.ref_name }}"
          echo "== manifest for ${IMAGE} =="
          docker buildx imagetools inspect "$IMAGE"
          docker buildx imagetools inspect --raw "$IMAGE" > /tmp/manifest.json
          python3 - <<'PY'
          import json, sys
          data = json.load(open('/tmp/manifest.json'))
          platforms = {
              f"{m.get('platform', {}).get('os')}/{m.get('platform', {}).get('architecture')}"
              for m in data.get('manifests', [])
          }
          print('platforms =', sorted(platforms))
          for expected in ('linux/amd64', 'linux/arm64'):
              if expected not in platforms:
                  sys.exit(f'missing {expected} in manifest list')
          PY
          echo "build digest = ${{ steps.build.outputs.digest }}"
          declare -A DIGESTS
          for TAG in latest "${{ inputs.tag || github.ref_name }}" "sha-${SHORT_SHA}"; do
            DIGESTS[$TAG]=$(docker buildx imagetools inspect --raw "${DH_IMAGE}:${TAG}" | sha256sum | cut -d' ' -f1)
            printf '%-16s manifest-sha256=%s\n' "$TAG" "${DIGESTS[$TAG]}"
          done
          for TAG in "${{ inputs.tag || github.ref_name }}" "sha-${SHORT_SHA}"; do
            [ "${DIGESTS[$TAG]}" = "${DIGESTS[latest]}" ] || { echo "::error::tag ${TAG} digest mismatch"; exit 1; }
          done
          echo "Multi-arch manifest and three tags verified."

      # 可选：导出 amd64 离线镜像供群晖「从文件导入」，避免国内拉取 Docker Hub 断流。
      - name: Export amd64 offline tar
        if: ${{ inputs.offline_tar }}
        run: |
          set -euo pipefail
          IMAGE="${DH_IMAGE}:${{ inputs.tag || github.ref_name }}"
          docker pull --platform linux/amd64 "$IMAGE"
          docker save -o "homepage-image-${{ inputs.tag || github.ref_name }}.tar" "$IMAGE"
          sha256sum "homepage-image-${{ inputs.tag || github.ref_name }}.tar"

      - name: Upload offline tar artifact
        if: ${{ inputs.offline_tar }}
        uses: actions/upload-artifact@v4
        with:
          name: homepage-offline-tar
          path: homepage-image-*.tar
          retention-days: 30
