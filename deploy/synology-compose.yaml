# 启动前改 3 类 CHANGE_ME（密码 / secret / 访问地址）与 volumes 左侧路径
services:
  homepage:
    image: boyu233/homepage-bookmark-manager:v1.2.0
    container_name: homepage
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      HOMEPAGE_AUTH_ENABLED: "true"
      HOMEPAGE_AUTH_PASSWORD: "CHANGE_ME_STRONG_PASSWORD"
      NEXTAUTH_SECRET: "CHANGE_ME_RANDOM_SECRET_AT_LEAST_32_CHARS"
      NEXTAUTH_URL: "http://192.168.1.100:3000"
      HOMEPAGE_ALLOWED_HOSTS: "192.168.1.100:3000"
      HOMEPAGE_CONFIG_DIR: "/app/config"
      TZ: "Asia/Shanghai"
      PORT: "3000"
      # v1.1.0 起：CHANGE_ME / 测试值 / 纯数字 等弱 secret 会告警；
      # 用 openssl rand -base64 32 生成，或设 HOMEPAGE_REQUIRE_STRONG_SECRET: "true" 强制拒绝占位符。
      #
      # 以下均为可选（不设即用默认）。MCP token 可读全部服务凭据，仅限内网使用，写权限默认关闭。
      # HOMEPAGE_MCP_ENABLED: "true"
      # HOMEPAGE_MCP_TOKEN: "CHANGE_ME_MCP_TOKEN_AT_LEAST_32_CHARS"
      # HOMEPAGE_MCP_ALLOW_WRITE: "false"
      # HOMEPAGE_REQUIRE_STRONG_SECRET: "true"
      # HOMEPAGE_PUBLIC_WIDGET_LIMIT: "180"
      # HOMEPAGE_AUDIO_LIMIT: "60"
      # HOMEPAGE_AUDIO_CONCURRENT: "4"
      # HOMEPAGE_RATE_LIMIT_ENABLED: "true"
      # v1.2.0 起：改配置请在网页「管理书签 → 配置更新」里上传，不用再覆盖文件 / 拉镜像。
      # HOMEPAGE_CONFIG_UPLOAD_MAX_BYTES: "524288"   # 单文件上限，硬上限 2MB
      # HOMEPAGE_CONFIG_WRITE_LIMIT: "30"            # 每 IP 每分钟写请求次数
    volumes:
      - /volume1/docker/homepage/config:/app/config
