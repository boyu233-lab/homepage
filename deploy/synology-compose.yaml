# 启动前改 3 类 CHANGE_ME（密码 / secret / 访问地址）与 volumes 左侧路径
services:
  homepage:
    image: boyu233/homepage-bookmark-manager:latest
    container_name: homepage
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      HOMEPAGE_AUTH_ENABLED: "true"
      HOMEPAGE_AUTH_PASSWORD: "CHANGE_ME_STRONG_PASSWORD"
      NEXTAUTH_SECRET: "CHANGE_ME_RANDOM_SECRET_AT_LEAST_32_CHARS"
      NEXTAUTH_URL: "http://192.168.1.100:3000"
      HOMEPAGE_ALLOWED_HOSTS: "192.168.1.100:3000"
      HOMEPAGE_CONFIG_DIR: "/app/config"
      TZ: "Asia/Shanghai"
      PORT: "3000"
    volumes:
      - /volume1/docker/homepage/config:/app/config
