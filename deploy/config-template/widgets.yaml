# Homepage - 顶部信息部件（脱敏默认配置）
# 左侧「首页」分组的布局由 custom.js + custom.css 接管：
#   搜索框 → 大号加粗时间 → [多源热搜 | B站音乐搜索] 左右并排（窄屏上下堆叠）。
# 切到其它书签分组时，时间/热搜/音乐部件自动隐藏，顶部只留资源信息与搜索框。
# 注意：search / datetime 必须排在前两位；news 与 bilibili_music 决定左右两栏顺序，不要随意调换。

- resources:
    cpu: true
    memory: true
    disk: /

- search:
    provider:
      - baidu
      - bing
      - google
      - duckduckgo
      - brave
    target: _blank
    focus: false

- datetime:
    text_size: 2xl
    locale: zh-CN
    format:
      dateStyle: full
      timeStyle: medium

- news:
    label: 百度热搜
    limit: 10               # 首页铺开几条（1-50）：置顶 1 条 + 排名 1..N，右侧显示热度
    refreshInterval: 60000  # 榜单分钟级更新；服务端缓存同为 60 秒
    target: _blank

    # v1.0.1 起 fixed：本部件只显示百度热搜榜官方接口（服务端代理），不再聚合 RSS。
    # 旧的 HOMEPAGE_NEWS_SOURCES / HOMEPAGE_NEWS_FEEDS / news.url 已失效，
    # 留在 compose 里也不会报错，建议删掉。来源是内置固定地址，不可配置，避免 SSRF。

- bilibili_music:
    label: B站音乐
    limit: 10                    # 每页展示的搜索结果条数（1-20）
    refreshInterval: 600000      # 同一关键词的搜索结果缓存 10 分钟
    target: _blank

    # v1.0.3 起：输入关键词搜索 B站视频 → 手动点选 → 只播放声音、不显示画面。
    # 搜索由服务端固定代理 api.bilibili.com/x/web-interface/wbi/search/type（免登录）；
    # 音轨经同源 /api/widgets/bilibili_audio 转发（B站 CDN 强制校验 Referer，浏览器无法直连）。
    # 上游地址与 CDN 域名白名单写死在镜像代码里，不可配置，避免 SSRF。
    # 注：key 沿用 bilibili_music 是历史命名，实际功能已不是音乐区排行榜。
