# Homepage - 顶部信息部件（脱敏默认配置）
# 左侧「首页」分组的布局由 custom.js + custom.css 接管：
#   搜索框 → 大号加粗时间 → 百度热搜榜，三者上下居中堆叠。
# 切到其它书签分组时，时间与新闻自动隐藏，顶部只留资源信息与搜索框。
# 注意：search / datetime / news 的先后顺序决定首页视图里的上下顺序，不要随意调换。

- resources:
    cpu: true
    memory: true
    disk: /

- search:
    provider:
      - baidu
      - bing
      - google
      - duckduckgo
      - brave
    target: _blank
    focus: false

- datetime:
    text_size: 2xl
    locale: zh-CN
    format:
      dateStyle: full
      timeStyle: medium

- news:
    label: 百度热搜
    limit: 10               # 首页铺开几条（1-50）：置顶 1 条 + 排名 1..N，右侧显示热度
    refreshInterval: 60000  # 榜单分钟级更新；服务端缓存同为 60 秒
    target: _blank

    # v1.0.1 起 fixed：本部件只显示百度热搜榜官方接口（服务端代理），不再聚合 RSS。
    # 旧的 HOMEPAGE_NEWS_SOURCES / HOMEPAGE_NEWS_FEEDS / news.url 已失效，
    # 留在 compose 里也不会报错，建议删掉。来源是内置固定地址，不可配置，避免 SSRF。
