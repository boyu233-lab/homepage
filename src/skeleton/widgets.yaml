# Homepage - 顶部信息部件（脱敏默认配置）
# 左侧「首页」分组的布局由 custom.js + custom.css 接管：
#   搜索框 → 大号加粗时间 → 实时新闻，三者上下居中堆叠。
# 切到其它书签分组时，时间与新闻自动隐藏，顶部只留资源信息与搜索框。
# 注意：search / datetime / news 的先后顺序决定首页视图里的上下顺序，不要随意调换。

- resources:
    cpu: true
    memory: true
    disk: /

- search:
    provider:
      - baidu
      - bing
      - google
      - duckduckgo
      - brave
    target: _blank
    focus: false

- datetime:
    text_size: 2xl
    locale: zh-CN
    format:
      dateStyle: full
      timeStyle: medium

- news:
    label: 实时新闻
    limit: 8
    refreshInterval: 300000
